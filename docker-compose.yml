name: donga-rag-dev

services:
  ai-service:
    build:
      context: ./ai-service
    ports:
      - "127.0.0.1:${CHAT_PORT:-8000}:8000"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Copy .env.example to .env and set INTERNAL_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-flash-lite-latest}
      GEMINI_EMBEDDING_MODEL: models/gemini-embedding-001
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-25}
      QDRANT_URL: ""
      QDRANT_COLLECTION: donga_regulations
      QDRANT_PATH: /srv/storage/qdrant_local
      CHUNKS_FILE: /srv/storage/chunks.jsonl
      DEMO_SEED_DIR: /srv/demo-seed
    volumes:
      - ai_storage:/srv/storage
      - type: bind
        source: ./ai-service/data/backup_pre_demo_20261104
        target: /srv/demo-seed
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=5).close()"]
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 3
    init: true
    stop_grace_period: 30s

volumes:
  ai_storage:
